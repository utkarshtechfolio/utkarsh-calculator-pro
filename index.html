<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkarsh Calculator Pro Max</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- TOP BAR (RESTORED) -->
  <div class="top">
    <button onclick="toggleHistory()">☰</button>
    <div class="brand">UTKARSH CALCULATOR PRO</div>
    <button onclick="toggleScientific()">Σ</button>
  </div>

  <!-- DISPLAY -->
  <input id="display" value="0" disabled>

  <!-- VOICE -->
  <button class="voice" onclick="startVoice()">🎤 Speak</button>

  <!-- SCIENTIFIC -->
  <div id="scientific" class="hidden">
    <button onclick="append('Math.sin(')">sin</button>
    <button onclick="append('Math.cos(')">cos</button>
    <button onclick="append('Math.tan(')">tan</button>
    <button onclick="append('Math.sqrt(')">√</button>
    <button onclick="append('Math.log10(')">log</button>
    <button onclick="append('Math.PI')">π</button>
  </div>

  <!-- GRID -->
  <div class="grid">

    <button class="gray" onclick="clearAll()">AC</button>
    <button class="gray" onclick="back()">⌫</button>
    <button class="gray" onclick="append('%')">%</button>
    <button class="orange" onclick="append('/')">÷</button>

    <button onclick="append('7')">7</button>
    <button onclick="append('8')">8</button>
    <button onclick="append('9')">9</button>
    <button class="orange" onclick="append('*')">×</button>

    <button onclick="append('4')">4</button>
    <button onclick="append('5')">5</button>
    <button onclick="append('6')">6</button>
    <button class="orange" onclick="append('-')">−</button>

    <button onclick="append('1')">1</button>
    <button onclick="append('2')">2</button>
    <button onclick="append('3')">3</button>
    <button class="orange" onclick="append('+')">+</button>

    <button class="zero" onclick="append('0')">0</button>
    <button onclick="append('.')">.</button>
    <button class="orange" onclick="calculate()">=</button>

  </div>

</div>

<!-- HISTORY PANEL -->
<div id="historyPanel" class="history hidden">
  <h3>History</h3>
  <div id="historyList"></div>
</div>

<script src="script.js"></script>
</body>
</html>
